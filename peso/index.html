<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EUR → ARS: Official vs Blue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  /* Layout: one centred column. Controls panel, two rate cards, a gap bar, then the chart. */
  :root{
    --bg:#eef1f6; --surface:#ffffff; --surface2:#f6f8fb; --ink:#0b1220; --mute:#5b6577; --line:#dde3ec;
    --off:#ea580c; --off-soft:rgba(234,88,12,.10);
    --blue:#2563eb; --blue-soft:rgba(37,99,235,.12);
    --good:#0f9d6a; --warn:#b45309;
    --shadow:0 1px 2px rgba(11,18,32,.05),0 8px 24px -12px rgba(11,18,32,.14);
    --display:'Space Grotesk',system-ui,sans-serif; --body:'Inter',system-ui,sans-serif;
    color-scheme:light;
  }
  @media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#090e19; --surface:#111a2b; --surface2:#16213a; --ink:#eaf0fb; --mute:#93a0b8; --line:#23314b;
    --off:#fb923c; --off-soft:rgba(251,146,60,.14); --blue:#5b9bff; --blue-soft:rgba(91,155,255,.15);
    --good:#34d399; --warn:#f0b35a; --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px -14px rgba(0,0,0,.6); color-scheme:dark}}
  :root[data-theme="dark"]{
    --bg:#090e19; --surface:#111a2b; --surface2:#16213a; --ink:#eaf0fb; --mute:#93a0b8; --line:#23314b;
    --off:#fb923c; --off-soft:rgba(251,146,60,.14); --blue:#5b9bff; --blue-soft:rgba(91,155,255,.15);
    --good:#34d399; --warn:#f0b35a; --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px -14px rgba(0,0,0,.6); color-scheme:dark}

  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);-webkit-font-smoothing:antialiased;
    background-image:radial-gradient(900px 380px at 15% -10%,var(--off-soft),transparent 70%),radial-gradient(800px 360px at 95% -5%,var(--blue-soft),transparent 70%);
    background-repeat:no-repeat}
  main{max-width:920px;margin:0 auto;padding-block:36px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
  header{padding:4px 2px 8px}
  .eyebrow{font:600 .72rem/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--mute);display:flex;gap:8px;align-items:center}
  .eyebrow i{width:22px;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--off),var(--blue))}
  h1{font:700 clamp(1.7rem,4.6vw,2.6rem)/1.08 var(--display);letter-spacing:-.02em;margin:10px 0 0;text-wrap:balance}
  h1 .a{color:var(--off)} h1 .b{color:var(--blue)}

  .panel,.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}
  .panel{padding:18px;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px 24px}
  @media(max-width:700px){.panel{grid-template-columns:1fr}}
  label,.lbl{display:block;font:600 .72rem/1 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin:0 0 9px}

  .lblrow{display:flex;justify-content:space-between;align-items:center;margin:-14px 0 -9px;gap:8px}
  .lblrow label{margin:0}
  .swap{display:inline-flex;align-items:center;gap:8px;min-height:44px;font:600 .9rem var(--body);color:var(--ink);background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:0 16px 0 12px;white-space:nowrap;cursor:pointer;transition:border-color .15s,background .15s}
  .swap:hover{border-color:var(--off)}
  .swap svg{width:18px;height:18px;transition:transform .4s cubic-bezier(.3,.9,.3,1)}
  .swap[data-flip="1"] svg{transform:rotate(180deg)}
  [hidden]{display:none!important}
  .convnote{margin-top:12px;font-size:.84rem;color:var(--mute);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
  .convnote button{font:600 .84rem var(--body);color:var(--off);background:none;border:0;padding:6px 0;cursor:pointer;text-decoration:underline}
  .done{display:none;flex:none;width:42px;height:42px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);place-items:center;cursor:pointer}
  .done svg{width:20px;height:20px}
  .amt:focus-within .done{display:grid}
  .amt{display:flex;align-items:center;gap:10px;background:var(--surface2);border:1.5px solid var(--line);border-radius:16px;padding:6px 16px;transition:border-color .15s,box-shadow .15s}
  .amt:focus-within{border-color:var(--off);box-shadow:0 0 0 4px var(--off-soft)}
  .amt .sym{font:600 1.5rem var(--display);color:var(--mute);min-width:1.6ch}
  .amt input{flex:1;min-width:0;width:100%;font:700 2.3rem/1.2 var(--display);letter-spacing:-.02em;color:var(--ink);background:transparent;border:0;outline:0;padding:6px 0;font-variant-numeric:tabular-nums;-moz-appearance:textfield}
  .amt input::-webkit-outer-spin-button,.amt input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .chip{font:500 .9rem var(--body);color:var(--ink);background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer;transition:transform .12s,border-color .15s,background .15s}
  .chip:hover{border-color:var(--off);transform:translateY(-1px)}
  .chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

  .stack{display:grid;gap:16px;align-content:start}
  .seg{position:relative;display:flex;background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:4px;gap:0}
  .seg .thumb{position:absolute;top:4px;bottom:4px;left:4px;width:0;border-radius:999px;background:var(--ink);transition:left .28s cubic-bezier(.3,.9,.3,1),width .28s cubic-bezier(.3,.9,.3,1);box-shadow:0 2px 8px rgba(0,0,0,.2)}
  .seg button{position:relative;z-index:1;flex:1;font:600 .9rem var(--body);color:var(--mute);background:transparent;border:0;border-radius:999px;padding:10px 12px;cursor:pointer;transition:color .2s;white-space:nowrap}
  .seg button:hover{color:var(--ink)}
  .seg button[aria-pressed=true]{color:var(--bg)}
  button:focus-visible{outline:2px solid var(--off);outline-offset:2px}
  input:focus-visible{outline:0}

  .grid{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
  .card{padding:20px 22px;position:relative;overflow:hidden}
  .card::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--c)}
  .card::after{content:"";position:absolute;right:-60px;top:-60px;width:180px;height:180px;border-radius:50%;background:var(--c);opacity:.09}
  .card.off{--c:var(--off)} .card.blue{--c:var(--blue)}
  .tag{display:flex;align-items:center;gap:8px;font:600 .8rem var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 22%,transparent)}
  .best{margin-left:auto;font:600 .7rem var(--body);letter-spacing:.06em;color:var(--good);background:color-mix(in srgb,var(--good) 14%,transparent);border-radius:999px;padding:4px 9px}
  .big{font:700 clamp(2rem,6vw,2.75rem)/1.1 var(--display);letter-spacing:-.025em;margin:14px 0 4px;font-variant-numeric:tabular-nums}
  .big small,.big .n{display:inline-block}
  .big.pop small,.big.pop .n{animation:pop .35s ease-out}
  @keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .big small{font:600 .9rem var(--body);letter-spacing:.08em;color:var(--mute);margin-right:8px}
  .rate{font-size:.85rem;color:var(--mute);font-variant-numeric:tabular-nums}

  .gap{padding:18px 22px;display:grid;gap:12px}
  .gaphead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 16px;align-items:baseline}
  .gaphead b{font:700 1.5rem var(--display);color:var(--good);letter-spacing:-.02em}
  .gaphead span{color:var(--mute);font-size:.92rem}
  .bars{display:grid;gap:8px}
  .bar{height:10px;border-radius:999px;background:var(--surface2);overflow:hidden}
  .bar i{display:block;height:100%;border-radius:999px;width:0;transition:width .6s cubic-bezier(.3,.9,.3,1)}

  .chartcard{padding:18px 18px 12px}
  .charthead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px 16px;padding:0 4px 10px}
  .headl{display:grid;gap:6px}
  .charthead .seg{flex:0 1 330px;min-width:min(100%,260px)}
  .charthead h2{font:600 1rem var(--display);margin:0}
  .legend{display:flex;gap:16px;font-size:.85rem;color:var(--mute)}
  .legend span{display:inline-flex;align-items:center;gap:7px}
  .legend i{width:14px;height:4px;border-radius:3px}
  .wrap{position:relative}
  svg{width:100%;height:auto;display:block;touch-action:pan-y}
  .tt{position:absolute;top:8px;pointer-events:none;opacity:0;transition:opacity .12s;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:12px;padding:10px 12px;font-size:.82rem;min-width:170px;z-index:2;font-variant-numeric:tabular-nums}
  .tt .d{color:var(--mute);margin-bottom:6px;font-weight:500}
  .tt .r{display:flex;justify-content:space-between;gap:14px;align-items:center}
  .tt .r b{font:600 .95rem var(--display)}
  .tt .g{margin-top:6px;padding-top:6px;border-top:1px solid var(--line);color:var(--good);font-weight:600}
  .hint{color:var(--mute);font-size:.8rem;padding:2px 4px 4px}
  .note{font-size:.78rem;color:var(--mute);margin:4px 4px 0;max-width:80ch}
  .warn{color:var(--warn)}
  .pulse{animation:pulse 2s ease-out infinite;transform-box:fill-box;transform-origin:center}
  @keyframes pulse{0%{transform:scale(1);opacity:.55}100%{transform:scale(3);opacity:0}}
  /* Typing on a phone: the keyboard covers about half the screen, so keep only the amount and the converted figures on show. */
  @media(max-width:700px){
    body.typing main{padding-top:10px;gap:10px}
    body.typing header,body.typing .chips,body.typing .stack,body.typing .gap,body.typing .chartcard,body.typing .note,body.typing .best,body.typing .card .rate,body.typing .card::after{display:none}
    body.typing .panel{padding:12px 14px}
    body.typing .lblrow{margin:0 0 8px}
    body.typing .amt input{font-size:2rem;padding:2px 0}
    body.typing .grid{gap:8px}
    body.typing .card{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px}
    body.typing .card .big{margin:0;font-size:1.7rem}
    body.typing .convnote{margin-top:8px;font-size:.78rem}
  }
  @media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main>
  <header>
    <div class="eyebrow"><i></i>Argentine peso · live rates</div>
    <h1><span id="h1a">Euros to pesos</span>: <span class="b">blue</span> vs <span class="a">official</span></h1>
  </header>

  <section class="panel" aria-label="Controls">
    <div>
      <div class="lblrow"><label for="amt">You have</label>
        <button class="swap" id="swap" type="button" data-flip="0" aria-label="Flip direction">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4 3 8l4 4"/><path d="M3 8h14"/><path d="m17 20 4-4-4-4"/><path d="M21 16H7"/></svg><span id="swapTxt">€ → ARS</span></button></div>
      <div class="amt"><span class="sym" id="sym">€</span><input id="amt" type="number" inputmode="decimal" enterkeyhint="done" min="0" step="any" value="100" aria-label="Amount">
        <button class="done" id="done" type="button" aria-label="Done, close keyboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></button></div>
      <div class="chips" id="chips"></div>
      <div class="convnote" id="convnote" role="status" hidden></div>
    </div>
    <div class="stack">
      <div><span class="lbl">Currency</span>
        <div class="seg" id="cur"><span class="thumb"></span>
          <button data-c="EUR" aria-pressed="true">€ Euro</button><button data-c="USD" aria-pressed="false">$ US dollar</button>
        </div></div>
    </div>
  </section>

  <section class="grid">
    <article class="card blue"><div class="tag"><i class="dot"></i>Blue<span class="best" id="bestBlue"></span></div>
      <div class="big"><small id="blueUnit">ARS</small><span class="n" id="blueAmt">…</span></div><div class="rate" id="blueRate"></div></article>
    <article class="card off"><div class="tag"><i class="dot"></i>Official<span class="best" id="bestOff" hidden></span></div>
      <div class="big"><small id="offUnit">ARS</small><span class="n" id="offAmt">…</span></div><div class="rate" id="offRate"></div></article>
  </section>

  <section class="card gap">
    <div class="gaphead"><b id="gapPct">…</b><span id="gapTxt"></span></div>
    <div class="bars">
      <div class="bar"><i id="barBlue" style="background:var(--blue)"></i></div>
      <div class="bar"><i id="barOff" style="background:var(--off)"></i></div>
    </div>
  </section>

  <section class="card chartcard">
    <div class="charthead">
      <div class="headl"><h2 id="chartTitle">Value over time</h2>
        <div class="legend"><span><i style="background:var(--blue)"></i>Blue</span><span><i style="background:var(--off)"></i>Official</span></div></div>
      <div class="seg" id="range" role="group" aria-label="History period"><span class="thumb"></span>
        <button data-d="30" aria-pressed="false">1M</button><button data-d="90" aria-pressed="true">3M</button>
        <button data-d="180" aria-pressed="false">6M</button><button data-d="365" aria-pressed="false">1Y</button><button data-d="1095" aria-pressed="false">3Y</button>
      </div>
    </div>
    <div class="wrap" id="wrap">
      <svg id="chart" viewBox="0 0 800 340" role="img" aria-label="Line chart of the official and blue values over time"></svg>
      <div class="tt" id="tt"></div>
    </div>
    <div class="hint">Hover or touch the chart to read a day's values.</div>
  </section>
  <p class="note" id="note"></p>
</main>

<script>
const $ = id => document.getElementById(id);
const fmt = (n, d=0) => n.toLocaleString('en-GB', {minimumFractionDigits:d, maximumFractionDigits:d});
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const iso = d => d.toISOString().slice(0,10);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let days = 90, series = null, demo = false, cur = 'EUR';
// Turning euros/dollars into pesos, a dealer pays the lower "compra" (buy) rate; buying euros/dollars with pesos costs the higher "venta" (sell) rate.
const rateO = p => dir==='fwd' ? p.officialBuy : p.official;
const rateB = p => dir==='fwd' ? p.blueBuy : p.blue;
const view = p => { const fx = cur==='EUR' ? p.eurusd : 1; return {date:p.date, o:rateO(p)*fx, b:rateB(p)*fx, fx}; };
const sym = () => cur==='EUR' ? '€' : 'US$';

async function getJSON(url){ const r = await fetch(url); if(!r.ok) throw new Error(url+' '+r.status); return r.json(); }

// Returns [{date, eurusd, official, officialBuy, blue, blueBuy}] — daily, forward-filled. ARS per US dollar; Buy = compra, the other = venta.
async function load(){
  const [off, blu, fx] = await Promise.all([
    getJSON('https://api.argentinadatos.com/v1/cotizaciones/dolares/oficial'),
    getJSON('https://api.argentinadatos.com/v1/cotizaciones/dolares/blue'),
    getJSON('https://api.frankfurter.dev/v1/'+iso(new Date(Date.now()-1100*864e5))+'..?base=EUR&symbols=USD')
  ]);
  const toMap = (a,k) => Object.fromEntries(a.map(x => [x.fecha, x[k] ?? x.venta]));
  const O = toMap(off,'venta'), OC = toMap(off,'compra'), B = toMap(blu,'venta'), BC = toMap(blu,'compra');
  const F = Object.fromEntries(Object.entries(fx.rates).map(([d,r]) => [d, r.USD]));
  const out = []; let o,oc,b,bc,f;
  const start = new Date(Date.now()-1095*864e5), end = new Date();
  for (let t=start; t<=end; t=new Date(+t+864e5)){
    const d = iso(t);
    o = O[d] ?? o; oc = OC[d] ?? oc; b = B[d] ?? b; bc = BC[d] ?? bc; f = F[d] ?? f;
    if (o && oc && b && bc && f) out.push({date:d, eurusd:f, official:o, officialBuy:oc, blue:b, blueBuy:bc});
  }
  if (out.length < 10) throw new Error('not enough data');
  return out;
}

function demoData(){ // offline fallback so the UI still works; clearly flagged
  const out=[]; let o=1000,b=1180,f=1.08;
  for(let i=1095;i>=0;i--){ const d=iso(new Date(Date.now()-i*864e5));
    o*=1+0.0012+Math.sin(i)*0.0004; b=o*(1.12+0.1*Math.sin(i/60)); f=1.08+0.06*Math.sin(i/200);
    out.push({date:d,eurusd:f,official:o,officialBuy:o*0.97,blue:b,blueBuy:b*0.99}); }
  return out;
}

let dir = 'fwd'; // fwd: euro/dollar -> pesos, rev: pesos -> euro/dollar
const conv = (amt, rate) => dir==='fwd' ? amt*rate : (rate ? amt/rate : 0);

// Count-up so numbers glide instead of jumping.
function tween(el, to, d){
  const from = el._v ?? to; el._v = to; cancelAnimationFrame(el._raf);
  if (reduce || from === to){ el.textContent = fmt(to,d); return; }
  const t0 = performance.now(), dur = 450;
  const step = now => { const k = Math.min(1,(now-t0)/dur), e = 1-Math.pow(1-k,3);
    el.textContent = fmt(from+(to-from)*e,d); if(k<1) el._raf = requestAnimationFrame(step); };
  el._raf = requestAnimationFrame(step);
}

function placeThumb(seg){
  const b = seg.querySelector('[aria-pressed=true]'), t = seg.querySelector('.thumb');
  if(b){ t.style.left = b.offsetLeft+'px'; t.style.width = b.offsetWidth+'px'; }
}

function buildChips(){
  const short = v => v>=1e6 ? (v/1e6)+'M' : v>=1e3 ? (v/1e3)+'k' : String(v);
  const vals = dir==='fwd' ? [10,20,50,100,500] : [10000,50000,100000,500000,1000000];
  const amt = parseFloat($('amt').value);
  $('chips').innerHTML = vals.map(v=>`<button class="chip" data-v="${v}" aria-pressed="${v===amt}">${dir==='fwd'?sym()+v:short(v)}</button>`).join('');
}

function render(){
  if(!series) return;
  const amt = Math.max(0, parseFloat($('amt').value)||0), d = dir==='fwd' ? 0 : 2;
  const lastRaw = series[series.length-1], last = view(lastRaw);
  const vo = conv(amt,last.o), vb = conv(amt,last.b);
  const name = cur==='EUR' ? 'Euros' : 'Dollars';
  const unit = dir==='fwd' ? 'ARS' : sym();
  $('h1a').textContent = dir==='fwd' ? `${name} to pesos` : `Pesos to ${name.toLowerCase()}`;
  $('offUnit').textContent = unit; $('blueUnit').textContent = unit;
  const key = dir+cur;
  if (render._k !== undefined && render._k !== key){ // direction or currency changed: show the new figures at once, don't count through the old ones
    for (const id of ['offAmt','blueAmt']) $(id)._v = undefined;
    for (const el of document.querySelectorAll('.big')){ el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); }
  }
  render._k = key;
  tween($('offAmt'), vo, d); tween($('blueAmt'), vb, d);
  const kind = dir==='fwd' ? 'buy rate' : 'sell rate';
  $('offRate').textContent  = (cur==='EUR' ? `1 € = ${fmt(last.o,2)} ARS  ·  USD ${fmt(rateO(lastRaw),0)} × ${fmt(last.fx,4)}` : `US$1 = ${fmt(last.o,2)} ARS`) + `  ·  ${kind}`;
  $('blueRate').textContent = (cur==='EUR' ? `1 € = ${fmt(last.b,2)} ARS  ·  USD ${fmt(rateB(lastRaw),0)} × ${fmt(last.fx,4)}` : `US$1 = ${fmt(last.b,2)} ARS`) + `  ·  ${kind}`;
  const gap = (last.b/last.o-1)*100, extra = Math.abs(vb-vo);
  $('gapPct').textContent = `+${fmt(gap,1)}% on ${dir==='fwd'?'blue':'official'}`;
  $('gapTxt').textContent = dir==='fwd'
    ? `${fmt(extra)} extra pesos on ${sym()}${fmt(amt,2)} · as of ${last.date}`
    : `${sym()}${fmt(extra,2)} extra on ARS ${fmt(amt)} · as of ${last.date}`;
  const mx = Math.max(vo,vb) || 1;
  $('barOff').style.width = (vo/mx*100)+'%'; $('barBlue').style.width = (vb/mx*100)+'%';
  const more = dir==='fwd' ? 'MORE PESOS' : 'MORE '+name.toUpperCase();
  $('bestBlue').textContent = more; $('bestOff').textContent = more;
  $('bestBlue').hidden = dir!=='fwd'; $('bestOff').hidden = dir!=='rev';
  $('swapTxt').textContent = dir==='fwd' ? `${sym()} → ARS` : `ARS → ${sym()}`;
  $('swap').setAttribute('aria-label', dir==='fwd' ? `Converting ${name.toLowerCase()} to pesos. Tap to flip to pesos to ${name.toLowerCase()}.` : `Converting pesos to ${name.toLowerCase()}. Tap to flip to ${name.toLowerCase()} to pesos.`);
  $('sym').textContent = dir==='fwd' ? (cur==='EUR' ? '€' : '$') : 'ARS';
  const per = $('range').querySelector('[aria-pressed=true]').textContent;
  $('chartTitle').textContent = dir==='fwd' ? `${sym()}${fmt(amt,2)} in pesos, last ${per}` : `ARS ${fmt(amt)} in ${name.toLowerCase()}, last ${per}`;
  buildChips();
  draw(series.slice(-days).map(view).map(p=>({date:p.date,o:conv(amt,p.o),b:conv(amt,p.b)})), d);
}

function draw(pts, dd){
  const W=800,H=340,m={l:62,r:18,t:14,b:28};
  const ys = pts.flatMap(p=>[p.o,p.b]);
  let lo=Math.min(...ys), hi=Math.max(...ys); const pad=(hi-lo||hi||1)*.12; lo=Math.max(0,lo-pad); hi+=pad;
  const x=i=>m.l+(W-m.l-m.r)*i/(pts.length-1), y=v=>H-m.b-(H-m.t-m.b)*(v-lo)/(hi-lo);
  const line=k=>pts.map((p,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(p[k]).toFixed(1)).join('');
  const area=k=>line(k)+`L${x(pts.length-1).toFixed(1)} ${H-m.b}L${m.l} ${H-m.b}Z`;
  const mute=css('--mute'), grid=css('--line'), off=css('--off'), blue=css('--blue'), surf=css('--surface');
  let g='';
  for(let i=0;i<=4;i++){ const v=lo+(hi-lo)*i/4, yy=y(v);
    g+=`<line x1="${m.l}" x2="${W-m.r}" y1="${yy}" y2="${yy}" stroke="${grid}" stroke-dasharray="${i?'2 5':'0'}"/><text x="${m.l-10}" y="${yy+4}" text-anchor="end" font-size="11" fill="${mute}">${fmt(v,dd)}</text>`; }
  for(let i=0;i<=4;i++){ const idx=Math.round((pts.length-1)*i/4);
    g+=`<text x="${x(idx)}" y="${H-7}" text-anchor="${i==0?'start':i==4?'end':'middle'}" font-size="11" fill="${mute}">${pts[idx].date}</text>`; }
  const n=pts.length-1;
  $('chart').innerHTML = `<defs>
    <linearGradient id="gO" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${off}" stop-opacity=".28"/><stop offset="1" stop-color="${off}" stop-opacity="0"/></linearGradient>
    <linearGradient id="gB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${blue}" stop-opacity=".28"/><stop offset="1" stop-color="${blue}" stop-opacity="0"/></linearGradient></defs>` + g +
    `<path d="${area('o')}" fill="url(#gO)"/><path d="${area('b')}" fill="url(#gB)"/>
     <path d="${line('o')}" fill="none" stroke="${off}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
     <path d="${line('b')}" fill="none" stroke="${blue}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
     <circle class="pulse" cx="${x(n)}" cy="${y(pts[n].o)}" r="4" fill="${off}"/><circle cx="${x(n)}" cy="${y(pts[n].o)}" r="4.5" fill="${off}" stroke="${surf}" stroke-width="2"/>
     <circle class="pulse" cx="${x(n)}" cy="${y(pts[n].b)}" r="4" fill="${blue}"/><circle cx="${x(n)}" cy="${y(pts[n].b)}" r="4.5" fill="${blue}" stroke="${surf}" stroke-width="2"/>
     <line id="cur" y1="${m.t}" y2="${H-m.b}" stroke="${mute}" stroke-dasharray="3 4" opacity="0"/>
     <circle id="d1" r="5" fill="${off}" stroke="${surf}" stroke-width="2" opacity="0"/><circle id="d2" r="5" fill="${blue}" stroke="${surf}" stroke-width="2" opacity="0"/>
     <rect id="hit" x="${m.l}" y="0" width="${W-m.l-m.r}" height="${H}" fill="transparent"/>`;
  const svg=$('chart'), hit=svg.querySelector('#hit'), curL=svg.querySelector('#cur'), d1=svg.querySelector('#d1'), d2=svg.querySelector('#d2'), tt=$('tt');
  const show=e=>{ const r=svg.getBoundingClientRect(), cx=e.touches?e.touches[0].clientX:e.clientX;
    const px=(cx-r.left)/r.width*W, i=Math.max(0,Math.min(n,Math.round((px-m.l)/(W-m.l-m.r)*n))), p=pts[i];
    curL.setAttribute('x1',x(i)); curL.setAttribute('x2',x(i)); curL.setAttribute('opacity',1);
    d1.setAttribute('cx',x(i)); d1.setAttribute('cy',y(p.o)); d2.setAttribute('cx',x(i)); d2.setAttribute('cy',y(p.b)); d1.setAttribute('opacity',1); d2.setAttribute('opacity',1);
    tt.innerHTML=`<div class="d">${p.date}</div>
      <div class="r"><span style="color:${blue}">● Blue</span><b>${fmt(p.b,dd)}</b></div>
      <div class="r"><span style="color:${off}">● Official</span><b>${fmt(p.o,dd)}</b></div>
      <div class="g">+${fmt((Math.max(p.o,p.b)/Math.min(p.o,p.b)-1)*100,1)}% on ${dir==='fwd'?'blue':'official'}</div>`;
    const pct=x(i)/W*100; tt.style.left = pct>58 ? `calc(${pct}% - ${tt.offsetWidth+14}px)` : `calc(${pct}% + 14px)`; tt.style.opacity=1; };
  const hide=()=>{ curL.setAttribute('opacity',0); d1.setAttribute('opacity',0); d2.setAttribute('opacity',0); tt.style.opacity=0; };
  hit.addEventListener('mousemove',show); hit.addEventListener('touchstart',show,{passive:true}); hit.addEventListener('touchmove',show,{passive:true});
  hit.addEventListener('mouseleave',hide); hit.addEventListener('touchend',hide);
}

function segInit(seg, onPick){
  seg.addEventListener('click', e=>{ const b=e.target.closest('button'); if(!b) return;
    seg.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b)); placeThumb(seg); onPick(b); });
}
segInit($('cur'), b=>{ cur=b.dataset.c; render(); });
// Flip direction. The amount is converted at the official rate, and flipping straight back restores the original figure.
let memo = null;
function setDir(nd){
  if(!series || nd===dir) return;
  const amt = Math.max(0, parseFloat($('amt').value)||0), v = conv(amt, view(series[series.length-1]).o);
  const produced = dir==='fwd' ? Math.round(v) : Math.round(v*100)/100;
  const money = (n, to) => to==='ars' ? `ARS ${fmt(n)}` : `${sym()}${fmt(n,2)}`;
  const from = money(amt, dir==='fwd' ? 'foreign' : 'ars');
  if (memo && memo.dir===dir && Math.abs(amt-memo.produced)<1e-9){ // untouched since the last flip: go back to what the user typed
    $('amt').value = memo.amt; memo = null; $('convnote').hidden = true;
  } else {
    $('amt').value = produced; memo = {amt, produced, dir:nd};
    $('convnote').innerHTML = `<span>${from} converted to ${money(produced, nd==='rev' ? 'ars' : 'foreign')} at the official rate.</span><button type="button" id="undo">Undo</button>`;
    $('convnote').hidden = false;
  }
  dir = nd; $('swap').dataset.flip = dir==='rev' ? 1 : 0; render();
}
$('convnote').addEventListener('click', e=>{ if(e.target.id==='undo') setDir(dir==='fwd' ? 'rev' : 'fwd'); });
segInit($('range'), b=>{ days=+b.dataset.d; render(); });
$('chips').addEventListener('click', e=>{ const b=e.target.closest('.chip'); if(!b) return; $('amt').value=b.dataset.v; $('convnote').hidden = true; render(); });
$('amt').addEventListener('input', ()=>{ $('convnote').hidden = true; render(); });
// Mobile number keypads have no Done key, so give the amount box a check button and close on Enter or a tap elsewhere.
$('amt').addEventListener('focus', ()=>{ document.body.classList.add('typing'); requestAnimationFrame(()=>scrollTo(0,0)); setTimeout(()=>$('amt').select(),0); });
$('amt').addEventListener('blur', ()=>document.body.classList.remove('typing'));
// Keep keyboard focus (and the compact typing layout) when these are tapped, so the page doesn't move under the finger.
for (const el of [$('done'), $('swap'), $('convnote')]) el.addEventListener('pointerdown', e=>e.preventDefault());
$('done').addEventListener('click', ()=>$('amt').blur());
$('amt').addEventListener('keydown', e=>{ if(e.key==='Enter') $('amt').blur(); });
document.addEventListener('pointerdown', e=>{ if(document.activeElement===$('amt') && !e.target.closest('.amt, .swap, .convnote')) $('amt').blur(); });
$('swap').addEventListener('click', ()=> setDir(dir==='fwd' ? 'rev' : 'fwd'));
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', render);
const thumbs=()=>{ placeThumb($('cur')); placeThumb($('range')); };
addEventListener('resize', thumbs); thumbs(); document.fonts && document.fonts.ready.then(thumbs);

(async()=>{
  try{ series = await load(); $('note').textContent='Rates: ARS per US dollar from ArgentinaDatos (daily values, one source for the whole chart), times the ECB EUR/USD reference rate from Frankfurter. Euro value = USD rate × EUR/USD. Turning euros or dollars into pesos uses the dealer buy rate (compra); turning pesos into euros or dollars uses the sell rate (venta). Real-life cash exchange rates and spreads will differ.'; }
  catch(err){ console.error(err); demo=true; series=demoData();
    $('note').innerHTML='<span class="warn"><b>Could not reach the live rate APIs.</b> Showing made-up demo numbers. Check your connection and reload.</span>'; }
  render(); thumbs();
})();
</script>
</body>
