<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EUR → ARS: Official vs Blue</title>
<style>
  :root{--bg:#f6f7f9;--card:#fff;--ink:#14181f;--mute:#667085;--line:#e4e7ec;--off:#2563eb;--blue:#0ea5a4;--warn:#b45309}
  @media(prefers-color-scheme:dark){:root{--bg:#0e1116;--card:#171b22;--ink:#eef1f5;--mute:#9aa4b2;--line:#2a313c;--off:#6ea0ff;--blue:#35d0cf;--warn:#f0b35a}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,sans-serif}
  main{max-width:880px;margin:0 auto;padding:24px 16px 48px}
  h1{font-size:1.4rem;margin:0 0 4px}
  .sub{color:var(--mute);margin:0 0 20px;font-size:.9rem}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
  .controls{display:flex;flex-wrap:wrap;gap:16px;align-items:end;margin-bottom:16px}
  label{display:block;font-size:.8rem;color:var(--mute);margin-bottom:4px}
  .amt{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;padding:0 10px;background:var(--bg)}
  .amt span{color:var(--mute);font-size:1.2rem}
  input{font:inherit;font-size:1.3rem;width:9ch;border:0;background:transparent;color:var(--ink);padding:8px 6px;outline:0}
  .seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .seg button{font:inherit;border:0;background:var(--bg);color:var(--ink);padding:10px 14px;cursor:pointer}
  .seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
  @media(max-width:560px){.grid{grid-template-columns:1fr}}
  .big{font-size:1.9rem;font-weight:650;font-variant-numeric:tabular-nums}
  .tag{display:inline-flex;align-items:center;gap:6px;font-size:.85rem;color:var(--mute)}
  .dot{width:10px;height:10px;border-radius:50%}
  .rate{font-size:.85rem;color:var(--mute);margin-top:2px}
  .gap{margin-bottom:16px;text-align:center}
  .gap b{font-size:1.1rem}
  svg{width:100%;height:auto;display:block}
  .tip{font-size:.85rem;min-height:1.3em;color:var(--mute);margin-top:6px;font-variant-numeric:tabular-nums}
  .note{font-size:.78rem;color:var(--mute);margin-top:14px}
  .warn{color:var(--warn)}
</style>
</head>
<body>
<main>
  <h1>🇪🇺 → 🇦🇷 Euro to Argentine Peso</h1>
  <p class="sub">Official rate vs. blue (informal) rate, with history. Enter euros or US dollars.</p>

  <div class="controls">
    <div><label for="amt">Amount</label>
      <div class="amt"><span id="sym">€</span><input id="amt" type="number" inputmode="decimal" min="0" step="any" value="20"></div></div>
    <div><label>Currency</label>
      <div class="seg" id="cur">
        <button data-c="EUR" aria-pressed="true">€ Euro</button><button data-c="USD">$ Dollar</button>
      </div></div>
    <div><label>Period</label>
      <div class="seg" id="range">
        <button data-d="30">1M</button><button data-d="90" aria-pressed="true">3M</button>
        <button data-d="180">6M</button><button data-d="365">1Y</button><button data-d="1095">3Y</button>
      </div></div>
  </div>

  <div class="grid">
    <div class="card"><div class="tag"><i class="dot" style="background:var(--off)"></i>Official</div>
      <div class="big" id="offAmt">…</div><div class="rate" id="offRate"></div></div>
    <div class="card"><div class="tag"><i class="dot" style="background:var(--blue)"></i>Blue</div>
      <div class="big" id="blueAmt">…</div><div class="rate" id="blueRate"></div></div>
  </div>
  <div class="card gap" id="gap"></div>

  <div class="card">
    <div class="tag" id="chartTitle">Value of the amount over time (ARS)</div>
    <svg id="chart" viewBox="0 0 800 340" role="img" aria-label="Line chart of official and blue values"></svg>
    <div class="tip" id="tip">Hover or tap the chart for a day's values.</div>
  </div>
  <p class="note" id="note"></p>
</main>

<script>
const $ = id => document.getElementById(id);
const fmt = (n, d=0) => n.toLocaleString('en-GB', {minimumFractionDigits:d, maximumFractionDigits:d});
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const iso = d => d.toISOString().slice(0,10);
let days = 90, series = null, demo = false, cur = 'EUR';
const view = p => cur==='EUR' ? {date:p.date,o:p.offEur,b:p.blueEur,fx:p.eurusd} : {date:p.date,o:p.official,b:p.blue,fx:1};
const sym = () => cur==='EUR' ? '€' : 'US$';

async function getJSON(url){ const r = await fetch(url); if(!r.ok) throw new Error(url+' '+r.status); return r.json(); }

// Returns [{date, eurusd, official, blue, offEur, blueEur}] — daily, forward-filled.
async function load(){
  const [off, blu, fx] = await Promise.all([
    getJSON('https://api.argentinadatos.com/v1/cotizaciones/dolares/oficial'),
    getJSON('https://api.argentinadatos.com/v1/cotizaciones/dolares/blue'),
    getJSON('https://api.frankfurter.dev/v1/'+iso(new Date(Date.now()-1100*864e5))+'..?base=EUR&symbols=USD')
  ]);
  const toMap = a => Object.fromEntries(a.map(x => [x.fecha, x.venta]));
  const O = toMap(off), B = toMap(blu);
  const F = Object.fromEntries(Object.entries(fx.rates).map(([d,r]) => [d, r.USD]));
  const out = []; let o,b,f;
  const start = new Date(Date.now()-1095*864e5), end = new Date();
  for (let t=start; t<=end; t=new Date(+t+864e5)){
    const d = iso(t);
    o = O[d] ?? o; b = B[d] ?? b; f = F[d] ?? f;
    if (o && b && f) out.push({date:d, eurusd:f, official:o, blue:b, offEur:o*f, blueEur:b*f});
  }
  if (out.length < 10) throw new Error('not enough data');
  return out;
}

function demoData(){ // offline fallback so the UI still works; clearly flagged
  const out=[]; let o=1000,b=1180,f=1.08;
  for(let i=1095;i>=0;i--){ const d=iso(new Date(Date.now()-i*864e5));
    o*=1+0.0012+Math.sin(i)*0.0004; b=o*(1.12+0.1*Math.sin(i/60)); f=1.08+0.06*Math.sin(i/200);
    out.push({date:d,eurusd:f,official:o,blue:b,offEur:o*f,blueEur:b*f}); }
  return out;
}

function render(){
  if(!series) return;
  const amt = Math.max(0, parseFloat($('amt').value)||0);
  const last = view(series[series.length-1]), usd = series[series.length-1];
  $('offAmt').textContent = '$ '+fmt(amt*last.o);
  $('blueAmt').textContent = '$ '+fmt(amt*last.b);
  $('offRate').textContent = cur==='EUR' ? `1 € = ${fmt(last.o,2)} ARS (USD ${fmt(usd.official,0)} × ${fmt(last.fx,4)})` : `US$1 = ${fmt(last.o,2)} ARS`;
  $('blueRate').textContent = cur==='EUR' ? `1 € = ${fmt(last.b,2)} ARS (USD ${fmt(usd.blue,0)} × ${fmt(last.fx,4)})` : `US$1 = ${fmt(last.b,2)} ARS`;
  const gap = (last.b/last.o-1)*100, extra = amt*(last.b-last.o);
  $('gap').innerHTML = `Blue gives <b>${fmt(gap,1)}%</b> more — <b>$ ${fmt(extra)}</b> extra on ${sym()}${fmt(amt,2)}. <span class="rate">As of ${last.date}</span>`;
  $('chartTitle').textContent = `What ${sym()}${fmt(amt,2)} is worth in ARS — last ${$('range').querySelector('[aria-pressed=true]').textContent}`;
  $('sym').textContent = cur==='EUR' ? '€' : '$';
  draw(series.slice(-days).map(view), amt);
}

function draw(pts, amt){
  const W=800,H=340,m={l:64,r:12,t:12,b:26};
  const ys = pts.flatMap(p=>[p.o*amt,p.b*amt]);
  let lo=Math.min(...ys), hi=Math.max(...ys); const pad=(hi-lo||hi||1)*.08; lo=Math.max(0,lo-pad); hi+=pad;
  const x=i=>m.l+(W-m.l-m.r)*i/(pts.length-1), y=v=>H-m.b-(H-m.t-m.b)*(v-lo)/(hi-lo);
  const path=k=>pts.map((p,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(p[k]*amt).toFixed(1)).join('');
  let g='';
  for(let i=0;i<=4;i++){ const v=lo+(hi-lo)*i/4, yy=y(v);
    g+=`<line x1="${m.l}" x2="${W-m.r}" y1="${yy}" y2="${yy}" stroke="${css('--line')}"/><text x="${m.l-8}" y="${yy+4}" text-anchor="end" font-size="11" fill="${css('--mute')}">${fmt(v)}</text>`; }
  for(let i=0;i<=4;i++){ const idx=Math.round((pts.length-1)*i/4);
    g+=`<text x="${x(idx)}" y="${H-6}" text-anchor="${i==0?'start':i==4?'end':'middle'}" font-size="11" fill="${css('--mute')}">${pts[idx].date}</text>`; }
  $('chart').innerHTML = g +
    `<path d="${path('o')}" fill="none" stroke="${css('--off')}" stroke-width="2.2"/>
     <path d="${path('b')}" fill="none" stroke="${css('--blue')}" stroke-width="2.2"/>
     <line id="cur" y1="${m.t}" y2="${H-m.b}" stroke="${css('--mute')}" stroke-dasharray="3" opacity="0"/>
     <rect id="hit" x="${m.l}" y="0" width="${W-m.l-m.r}" height="${H}" fill="transparent"/>`;
  const hit=$('chart').querySelector('#hit'), cur=$('chart').querySelector('#cur');
  const move=e=>{ const r=$('chart').getBoundingClientRect(), cx=(e.touches?e.touches[0].clientX:e.clientX);
    const px=(cx-r.left)/r.width*W; const i=Math.max(0,Math.min(pts.length-1,Math.round((px-m.l)/(W-m.l-m.r)*(pts.length-1))));
    const p=pts[i]; cur.setAttribute('x1',x(i)); cur.setAttribute('x2',x(i)); cur.setAttribute('opacity',1);
    $('tip').innerHTML=`${p.date} — Official <b style="color:${css('--off')}">$ ${fmt(p.o*amt)}</b> · Blue <b style="color:${css('--blue')}">$ ${fmt(p.b*amt)}</b> · gap ${fmt((p.b/p.o-1)*100,1)}%`; };
  hit.addEventListener('mousemove',move); hit.addEventListener('touchmove',move,{passive:true}); hit.addEventListener('touchstart',move,{passive:true});
}

$('amt').addEventListener('input', render);
$('range').addEventListener('click', e=>{ const b=e.target.closest('button'); if(!b) return;
  days=+b.dataset.d; $('range').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b)); render(); });
$('cur').addEventListener('click', e=>{ const b=e.target.closest('button'); if(!b) return;
  cur=b.dataset.c; $('cur').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b)); render(); });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', render);

(async()=>{
  try{ series = await load(); $('note').textContent='Rates: ARS "venta" (selling) rate per US dollar from ArgentinaDatos (daily closing values, the same source for the whole chart), times the ECB EUR/USD reference rate (Frankfurter). Euro value = USD rate × EUR/USD. Real-life cash exchange rates and spreads will differ.'; }
  catch(err){ console.error(err); demo=true; series=demoData();
    $('note').innerHTML='<span class="warn"><b>Could not reach the live rate APIs</b> — showing made-up demo numbers. Check your connection and reload.</span>'; }
  render();
})();
</script>
</body>
</html>
